name: Standalone application
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python scripts/verify.py
      - run: docker build -t astra-focus-test .
      - name: Smoke-test packaged application
        run: |
          docker run -d --name focus-test -p 127.0.0.1:8080:8080 -e ASTRA_DEMO=1 -e FF_DATA=/app/FF_app/data/mini/fleet.json.gz astra-focus-test
          python scripts/check_health.py http://127.0.0.1:8080/readyz
      - name: Container logs
        if: always()
        run: docker logs focus-test || true
